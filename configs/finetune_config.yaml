# ─────────────────────────────────────────────────────────────────────────────
# Multi-resolution HuBERT — Fusion C Fine-tuning Config
#
# Architecture:  MultiResHuBERT (speech) + Qwen3-Embedding-0.6B (text) → FusionScoringHead
# Dataset:       mispeech/speechocean762 (utterance-level pronunciation scoring)
# ─────────────────────────────────────────────────────────────────────────────

data:
  hf_dataset_id:      "mispeech/speechocean762"
  train_split:        "train"
  test_split:         "test"
  max_duration_s:     20.0
  batch_size:         32        # was 16; larger batch reduces gradient variance
  num_workers:        4
  transcript_field:   "text"

model:
  # Speech encoder — loaded from a pre-training checkpoint
  pretrain_checkpoint:      "../checkpoints/pretrain/best_model.pt"
  hubert_model_name:        "facebook/hubert-large-ll60k"
  f1_layer_count:           8
  f2_layer_count:           8
  f3_layer_count:           8
  downsample_stride:        2
  pretrain:                 false     # must be false for fine-tuning
  mask_prob:                0.0       # masking disabled during fine-tuning
  mask_length:              0
  freeze_feature_extractor: true      # CNN extractor always frozen
  freeze_f1_layers:         false     # fine-tune all transformer blocks
  freeze_f2_layers:         false
  freeze_f3_layers:         false
  speech_rep_dim:           1024      # hubert-large hidden size

  # Pre-training head sizes (must match checkpoint)
  num_units_hi:             100
  num_units_lo:             100

  # Text encoder — Qwen3-Embedding-0.6B
  # Notes:
  #   - decoder-only: last-token pooling (NOT [CLS])
  #   - tokenizer requires padding_side="left"
  #   - output 1024-dim, L2-normalized, float32
  #   - requires transformers>=4.51.0
  #   - INCOMPATIBLE with previous encoder checkpoints (fusion concat dim changed)
  text_encoder_name:    "Qwen/Qwen3-Embedding-0.6B"
  text_encoder_dim:     1024         # last-token output dim
  freeze_text_encoder:  true         # start frozen; unfreeze with lr_text_encoder=1e-5
  text_max_length:      128          # transcripts are short; 128 is sufficient

  # Fusion head
  fusion_hidden:        512
  n_scores:             4   # completeness removed — skewed distribution
                            # causes persistent low PCC; excluded from training
  dropout:              0.1
  gate_fusion:          true

training:
  output_dir:               "../checkpoints/finetune"
  epochs:                   50
  lr_speech_encoder:        5.0e-5   # param group A
  lr_fusion_head:           1.0e-4   # param group B
  lr_text_encoder:          1.0e-5   # was 0.0; gentle Qwen3 fine-tune for accuracy
  min_lr:                   1.0e-5   # was 1.0e-6; LR floor was decaying too fast
  lr_scheduler:             "cosine"
  warmup_steps:             1000     # was 500; slower ramp-up avoids early overshoot
  optimizer:                "adamw"
  weight_decay:             1.0e-2
  betas:                    [0.9, 0.98]
  grad_clip:                1.0
  use_amp:                  true
  device:                   "cuda"
  mse_weight:               0.5
  pcc_weight:               0.5
  save_every_n_epochs:      5
  keep_last_n_checkpoints:  3
  best_metric:              "val_pcc_total"
  early_stopping:           true
  patience:                 10
  min_delta:                0.001
  grad_accumulation_steps:  2        # NEW; effective batch = 32 × 2 = 64
  label_smooth_alpha:       0.05     # NEW; dampens noisy batch outliers
  log_every:                20       # optimizer steps between step-level log writes

logging:
  use_wandb:    false
  use_tb:       true
  tb_log_dir:   "../logs/finetune"
  run_name:     "finetune-fusionC-qwen3-emb"

sync:
  enabled:   false      # set true to auto-push checkpoints to your local machine

  method:    "rsync"    # "rsync" | "scp" | "rclone"

  # ── rsync / scp  (server pushes to local Windows via OpenSSH) ──────────
  # Enable Windows OpenSSH server: Settings → Optional features → OpenSSH Server
  dest_user:  "your_windows_username"
  dest_host:  "your_local_ip"       # e.g. 192.168.1.100 or VPN address
  dest_port:  22
  ssh_key:    "~/.ssh/id_rsa"       # private key on the Vast.ai instance
  dest_path:  "/c/Users/your_windows_username/checkpoints/finetune/"  # MSYS2 path
  ssh_opts:   ""                    # extra SSH flags, e.g. "-o ProxyJump=relay.host"

  # ── rclone  (push to cloud storage, then rclone sync locally on Windows) ─
  rclone_remote:  "gdrive:ml/checkpoints/finetune/"
  rclone_args:    ""                # extra rclone flags, e.g. "--transfers 4"

  # ── common ────────────────────────────────────────────────────────────────
  timeout_s:      300     # seconds before a single transfer is killed
  max_retries:    3       # retry attempts with exponential back-off (2s, 4s, 8s)
  delete_after:   false   # remove checkpoint from server after successful transfer
