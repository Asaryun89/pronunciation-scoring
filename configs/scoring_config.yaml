# ─────────────────────────────────────────────────────────────────────────────
# Multi-resolution HuBERT + Qwen3 Cross-Attention Pronunciation Scorer
#
# Architecture:
#   Audio: MultiResHuBERT (pretrained) → weighted sum of 12 layers
#          → Linear(768, 256) → TransformerEncoder ×1  (Q)
#   Text:  Faster-Whisper ASR → Qwen3-Embedding-0.6B → mask-aware mean pool
#          → Linear(1024, 256) + LayerNorm             (K/V)
#   Fusion: CrossAttention(Q, K, V) → TransformerEncoder ×2
#          → mean pool → MLPScoringHead → 5 scores × 10
# ─────────────────────────────────────────────────────────────────────────────

data:
  hf_dataset_id:      "mispeech/speechocean762"
  train_split:        "train"
  test_split:         "test"
  max_duration_s:     20.0
  sample_rate:        16000
  batch_size:         4
  num_workers:        4

  # ASR — Faster-Whisper (run data/speechocean_asr.py --cache ONCE before training)
  asr_model:          "base.en"
  asr_device:         "cuda"
  asr_compute_type:   "float16"
  asr_cache_path:     "../data/asr_transcripts.pkl"

  # Audio preprocessing
  vad_threshold:      0.5            # silero VAD probability threshold
  target_sr:          16000

model:
  # ── Multi-res HuBERT backbone ─────────────────────────────────────────────
  # NOTE: speech_hidden_dim must match the pretrained checkpoint's HuBERT size.
  #   hubert-base-ls960  → speech_hidden_dim: 768,  layers: 4+4+4  = 12
  #   hubert-large-ll60k → speech_hidden_dim: 1024, layers: 8+8+8  = 24
  pretrain_checkpoint:      "../checkpoints/pretrain/final_pretrain.pt"
  hubert_model_name:        "facebook/hubert-base-ls960"
  f1_layer_count:           4
  f2_layer_count:           4
  f3_layer_count:           4
  downsample_stride:        2
  freeze_feature_extractor: true
  freeze_f1_layers:         false
  freeze_f2_layers:         false
  freeze_f3_layers:         false
  num_hidden_layers:        12           # total transformer layers (f1+f2+f3)
  speech_hidden_dim:        768          # hubert-base hidden size
  use_weighted_sum:         true         # learnable weighted sum of all layers

  # ── Projection and pre-fusion transformer ────────────────────────────────
  proj_dim:             256          # shared dim for audio Q and text K/V

  pre_fusion_layers:    1
  pre_fusion_heads:     4
  pre_fusion_dropout:   0.1

  # ── Qwen3 text encoder ────────────────────────────────────────────────────
  # Requires transformers>=4.51.0; padding_side="left" critical.
  text_encoder_name:    "Qwen/Qwen3-Embedding-0.6B"
  text_encoder_dim:     1024
  freeze_text_encoder:  true         # frozen; unfreeze with care (596M params)
  text_max_length:      128
  text_padding_side:    "left"       # MUST be "left" for decoder-only last-token pooling

  # ── Cross-attention fusion ────────────────────────────────────────────────
  fusion_heads:         4
  fusion_dropout:       0.1

  # ── Post-fusion transformer ───────────────────────────────────────────────
  post_fusion_layers:   2
  post_fusion_heads:    4
  post_fusion_dropout:  0.1

  # ── Scoring head ──────────────────────────────────────────────────────────
  n_scores:             4            # completeness excluded — skewed distribution
  score_dims:           ["total", "accuracy", "fluency", "prosodic"]
  scoring_dropout:      0.1

  # ── Auxiliary phoneme head (Phase 4) ─────────────────────────────────────
  num_phonemes:         40           # reduced Arpabet set

training:
  output_dir:               "../checkpoints/scorer"
  epochs:                   50
  lr_speech_encoder:        5.0e-5   # param group A — MultiResHuBERT backbone
  lr_audio_proj:            1.0e-4   # param group B — proj + layer_weights + pre-fusion
  lr_text_encoder:          0.0      # param group C — Qwen3 (frozen)
  lr_fusion:                1.0e-4   # param group D — cross-attn + post-fusion + scoring + phoneme head
  min_lr:                   1.0e-6
  lr_scheduler:             "cosine"
  warmup_steps:             500
  optimizer:                "adamw"
  weight_decay:             1.0e-2
  betas:                    [0.9, 0.98]
  grad_clip:                3.0      # raised from 1.0; normal range 2.06-3.20, spikes 5.0-6.2
  grad_accumulation_steps:  2
  use_amp:                  true
  device:                   "cuda"
  save_every_n_epochs:      5
  keep_last_n_checkpoints:  3
  best_metric:              "val_pcc_total"
  patience:                 5        # tightened from 10; rebalanced loss converges earlier
  min_delta:                0.001
  log_every:                20

  # ── Composite loss (Upgrade 3 / Phase 1 rebalanced) ──────────────────────
  # Justified by run_20260605 analysis:
  #   ListMLE mean=0.475 (2.89× Huber) → alpha 0.30→0.15
  #   CCC std=0.175, MSE not converging → gamma 0.20→0.35
  loss_alpha:               0.15
  loss_gamma:               0.35
  loss_beta:                0.10
  loss_warmup_steps:        1000
  loss_huber_delta:         1.0
  loss_lambdas:             [1.0, 1.0, 0.5, 1.0]  # lower weight on prosodic
  loss_smooth_std:          0.3

  # ── Phase 4: auxiliary phoneme CE ────────────────────────────────────────
  use_phoneme_aux:          true     # set false to disable without code change
  phoneme_model:            "facebook/wav2vec2-base"  # CTC model for Sub-path B

logging:
  use_tb:       true
  tb_log_dir:   "../logs/scorer"
  run_name:     "multireshubert-qwen3-crossattn"
