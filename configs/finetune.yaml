data:
  hf_dataset_id:    "mispeech/speechocean762"
  train_split:      "train"
  val_split:        "test"
  max_duration_s:   20.0
  batch_size:       16
  num_workers:      4
  augment:          true

model:
  hubert_model_name:        "facebook/hubert-large-ll60k"
  f1_layer_count:           8
  f2_layer_count:           8
  f3_layer_count:           8
  downsample_stride:        2
  pretrain:                 false
  mask_prob:                0.0
  mask_length:              0
  freeze_feature_extractor: true
  freeze_f1_layers:         false
  fusion_hidden:            512
  n_scores:                 5
  dropout:                  0.1

training:
  output_dir:     "../checkpoints/finetune"
  epochs:         50
  learning_rate:  1.0e-4
  weight_decay:   1.0e-2
  warmup_steps:   500
  grad_clip:      1.0
  use_amp:        true
  device:         "cuda"
  mse_weight:     1.0
  corr_weight:    0.5
  score_weights:  [1.0, 1.0, 1.0, 1.0, 2.0]
  log_every:      50
  eval_every:     1
  save_best:      true

logging:
  use_wandb:    false
  use_tb:       true
  tb_log_dir:   "../logs/finetune"
  project:      "multi-res-hubert"
  run_name:     "finetune-base"